version: "3.8"

services:
  # ========================
  # Application PHP-FPM
  # ========================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development  # Utilise le stage 'development' du Dockerfile
      args:
        - USER_ID=${USER_ID:-1000}
        - GROUP_ID=${GROUP_ID:-1000}
    container_name: wereticket_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      # Code source (bind mount pour le développement)
      - .:/var/www
      # Volumes nommés pour les dossiers critiques (meilleure performance)
      - vendor_data:/var/www/vendor
      - node_modules_data:/var/www/node_modules
      # Cache Laravel
      - storage_cache:/var/www/storage/framework/cache
      - storage_sessions:/var/www/storage/framework/sessions
      - storage_views:/var/www/storage/framework/views
    networks:
      - wereticket_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-wereticket}
      - DB_USERNAME=${DB_USERNAME:-wereticket_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================
  # Serveur Web Nginx
  # ========================
  web:
    image: nginx:1.25-alpine
    container_name: wereticket_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - nginx_logs:/var/log/nginx
    networks:
      - wereticket_network
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================
  # Base de données MySQL
  # ========================
  db:
    image: mysql:8.0
    container_name: wereticket_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-wereticket}
      MYSQL_USER: ${DB_USERNAME:-wereticket_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - wereticket_network
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================
  # Redis pour Cache/Sessions
  # ========================
  redis:
    image: redis:7-alpine
    container_name: wereticket_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-null}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - wereticket_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================
  # PHPMyAdmin (optionnel)
  # ========================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: wereticket_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-wereticket_user}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
      UPLOAD_LIMIT: 100M
    networks:
      - wereticket_network
    depends_on:
      - db
    profiles:
      - tools  # Démarre uniquement avec: docker-compose --profile tools up

  # ========================
  # Mailhog (capture d'emails)
  # ========================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: wereticket_mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_PORT:-8025}:8025"  # Interface web
      - "${MAILHOG_SMTP_PORT:-1025}:1025"  # SMTP
    networks:
      - wereticket_network
    profiles:
      - tools  # Démarre uniquement avec: docker-compose --profile tools up

  # ========================
  # Queue Worker (optionnel)
  # ========================
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: wereticket_queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - vendor_data:/var/www/vendor
    networks:
      - wereticket_network
    depends_on:
      - app
      - redis
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    profiles:
      - workers  # Démarre uniquement avec: docker-compose --profile workers up

# ========================
# Réseaux
# ========================
networks:
  wereticket_network:
    driver: bridge

# ========================
# Volumes persistants
# ========================
volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  vendor_data:
    driver: local
  node_modules_data:
    driver: local
  storage_cache:
    driver: local
  storage_sessions:
    driver: local
  storage_views:
    driver: local
  nginx_logs:
    driver: local
